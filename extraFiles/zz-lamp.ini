; Overrides layered on top of the official php.ini-production.
; Projects can override any of these by dropping their own file in
; /usr/local/etc/php/conf.d/ with a name that sorts after "zz-lamp".

memory_limit = 2G
max_execution_time = 600
post_max_size = 2G
upload_max_filesize = 2G
max_input_vars = 10000

; Send errors to stderr so they show up in `docker logs`.
error_log = /proc/self/fd/2

[Date]
date.timezone = UTC

; Large realpath cache pays off with Symfony/Sylius/Magento autoloading.
realpath_cache_size = 10M
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
; Magento needs a high ceiling here; the 10000 default is not enough.
opcache.max_accelerated_files = 60000
; Production default: code is baked into the image and never changes at
; runtime. Mount extraFiles/dev.ini for a live-reloading dev container.
opcache.validate_timestamps = 0
; Required by Symfony/Doctrine annotations.
opcache.save_comments = 1

; PHP 8.5 JIT. Automatically disabled when Xdebug is loaded.
opcache.jit = tracing
opcache.jit_buffer_size = 128M
