# DocumentRoot is driven by the APACHE_DOCUMENT_ROOT environment variable so
# the same image serves Symfony/Sylius (public/) and Magento (pub/) without a
# rebuild. Default: /var/www/html/public
<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot ${APACHE_DOCUMENT_ROOT}

	<Directory ${APACHE_DOCUMENT_ROOT}>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
		FallbackResource /index.php
	</Directory>

	<Directory ${APACHE_DOCUMENT_ROOT}/bundles>
		FallbackResource disabled
	</Directory>

	# Log to stdout/stderr so `docker logs` works.
	ErrorLog  /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined
</VirtualHost>
