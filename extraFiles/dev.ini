; Development overrides. NOT enabled by default.
; Copy into a project image to get live code reloading and visible errors:
;
;   COPY dev.ini /usr/local/etc/php/conf.d/zzz-dev.ini

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Without this, code mounted as a volume is cached and edits appear to do
; nothing -- the base image ships production settings.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; JIT gets in the way of step debugging.
opcache.jit = disable
